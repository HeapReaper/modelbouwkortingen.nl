# Volledige stack: Postgres + migraties + website + crawler.
#
# Coolify (Docker Compose build pack):
#   - SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES / SERVICE_PASSWORD_64_CRAWLERSTATS
#     worden automatisch door Coolify gegenereerd.
#   - SERVICE_FQDN_WEB_3000 koppelt een domein aan de web-service (poort 3000);
#     stel het domein in bij de web-service in Coolify.
#   - Overige variabelen (ADMIN_PASSWORD, STATS_TOKEN, ...) verschijnen in de Coolify UI.
#
# Lokaal: zet SERVICE_USER_POSTGRES, SERVICE_PASSWORD_POSTGRES en
# SERVICE_PASSWORD_64_CRAWLERSTATS in .env en draai `docker compose up -d --build`.
# De website is dan bereikbaar via de container op poort 3000 (voeg eventueel
# een `ports:` override toe in docker-compose.override.yml).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: modelbouwkortingen
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Past de Prisma-migraties toe en stopt daarna; crawler en web wachten hierop.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    # Eenmalige container: niet meenemen in de Coolify health status.
    exclude_from_hc: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/modelbouwkortingen?sslmode=disable

  crawler:
    build:
      context: ./crawler
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Stats-poort alleen intern; de website leest hem via http://crawler:8080/stats
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/modelbouwkortingen?sslmode=disable
      CRAWLER_STATS_TOKEN: ${SERVICE_PASSWORD_64_CRAWLERSTATS}
      CRAWLER_INTERVAL: ${CRAWLER_INTERVAL:-6h}
      CRAWLER_WORKERS_PER_SHOP: ${CRAWLER_WORKERS_PER_SHOP:-4}
      CRAWLER_HOST_DELAY: ${CRAWLER_HOST_DELAY:-500ms}
      CRAWLER_MAX_PRODUCT_PAGES: ${CRAWLER_MAX_PRODUCT_PAGES:-4000}
      MIN_DISCOUNT_EUR: ${MIN_DISCOUNT_EUR:-5}
      MIN_DISCOUNT_PERCENT: ${MIN_DISCOUNT_PERCENT:-5}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Geen `ports:` — Coolify's proxy (Traefik/Caddy) routeert via SERVICE_FQDN_WEB_3000.
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_WEB_3000
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/modelbouwkortingen?sslmode=disable
      - NEXT_PUBLIC_SITE_URL=${SERVICE_URL_WEB:-https://modelbouwkortingen.nl}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - STATS_TOKEN=${STATS_TOKEN:-}
      - CRAWLER_STATS_URL=http://crawler:8080/stats
      - CRAWLER_STATS_TOKEN=${SERVICE_PASSWORD_64_CRAWLERSTATS}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - NEWSLETTER_SEND_HOUR=${NEWSLETTER_SEND_HOUR:-8}
      - NEWSLETTER_SCHEDULER=${NEWSLETTER_SCHEDULER:-}
      - NEWSLETTER_CRON_TOKEN=${NEWSLETTER_CRON_TOKEN:-}
      - LIBRETRANSLATE_URL=${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      - ALERT_DISCORD_WEBHOOK=${ALERT_DISCORD_WEBHOOK:-}
      - CRAWL_ALERT_RATIO=${CRAWL_ALERT_RATIO:-0.5}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Vertaalt productnamen van Duitse en Franse webshops (gratis, draait op de CPU). Bij de
  # eerste start downloadt hij de taalmodellen naar het volume; tot die klaar zijn toont de site
  # de originele namen.
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      - LT_LOAD_ONLY=de,fr,es,it,pt,nl,en
      - LT_DISABLE_WEB_UI=true
    volumes:
      - ltmodels:/home/libretranslate/.local

volumes:
  pgdata:
  ltmodels:
