# Zelf bouwen in plaats van de images uit het register op te halen:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  migrate:
    build:
      context: .
      target: migrate
    pull_policy: build
  crawler:
    build:
      context: ./crawler
    pull_policy: build
  web:
    build:
      context: .
      target: runner
    pull_policy: build
